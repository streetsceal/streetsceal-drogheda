<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>StreetScéal — Town Trail Map Test v2 (hidden)</title>
<style>
  :root {
    --parchment: #f4ecdc;
    --teal: #2f6f6a;
    --rust: #c86a4e;
    --ink: #1f2320;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--parchment);
  }
  #banner {
    background: var(--ink);
    color: var(--parchment);
    padding: 8px 14px;
    font-size: 13px;
    letter-spacing: 0.02em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #banner strong { color: #e8c9a0; }
  #status {
    font-size: 12px;
    opacity: 0.85;
  }
  #map {
    width: 100%;
    height: calc(100% - 38px);
  }
  .legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: rgba(244, 236, 220, 0.95);
    border: 1px solid var(--teal);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--ink);
    max-width: 240px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .legend div { margin: 2px 0; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  #clear-route {
    display: none;
    position: absolute;
    top: 48px;
    right: 16px;
    background: var(--parchment);
    border: 1px solid var(--teal);
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="banner">
  <span><strong>HIDDEN TEST v2</strong> — tap any stop, get a straight-line route from where you are</span>
  <span id="status">Locating map…</span>
</div>

<div id="map"></div>
<button id="clear-route">Clear route</button>

<div class="legend">
  <div><span class="dot" style="background:#c8a96e"></span>Trail stops — tap to route to it</div>
  <div><span class="dot" style="background:#3a7bd5"></span>Your live position</div>
  <div style="margin-top:6px; opacity:0.75;">No fixed order — choose any stop, any time.</div>
</div>

<script>
// ── Town Trail stop data (from trails.json) — no ordering implied ──
const stops = [
  { id: "white-horse", name: "The White Horse Hotel", lat: 53.714978, lng: -6.353384 },
  { id: "connollys-shop", name: "Connolly's Shop", lat: 53.71376, lng: -6.349491 },
  { id: "millmount", name: "Millmount", lat: 53.711665, lng: -6.349454 },
  { id: "laurence-gate", name: "St Laurence's Gate", lat: 53.71596, lng: -6.347152 },
  { id: "st-peters-church-of-ireland", name: "St Peter's Church of Ireland", lat: 53.716747, lng: -6.350144 },
  { id: "siena-convent", name: "Siena Convent", lat: 53.71715, lng: -6.346015 },
  { id: "st-peters", name: "St Peter's Church", lat: 53.715034, lng: -6.352422 },
  { id: "quayside", name: "The Quayside", lat: 53.71381, lng: -6.348835 }
];

let map;
let liveMarker = null;
let liveLatLng = null;
let routeLine = null;
let selectedStopId = null;
const stopMarkers = {};

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function initMap() {
  const bounds = new google.maps.LatLngBounds();
  stops.forEach(s => bounds.extend({ lat: s.lat, lng: s.lng }));

  map = new google.maps.Map(document.getElementById('map'), {
    zoom: 16,
    center: bounds.getCenter(),
    disableDefaultUI: false
  });
  map.fitBounds(bounds, 60);

  // Unordered stop markers — plain gold dots, no numbers, no implied sequence
  stops.forEach((stop) => {
    const marker = new google.maps.Marker({
      position: { lat: stop.lat, lng: stop.lng },
      map,
      title: stop.name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 10,
        fillColor: '#c8a96e',
        fillOpacity: 1,
        strokeColor: '#1f2320',
        strokeWeight: 1.5
      }
    });

    const info = new google.maps.InfoWindow({
      content: `<strong>${stop.name}</strong>`
    });

    marker.addListener('click', () => {
      info.open(map, marker);
      selectStop(stop);
    });

    stopMarkers[stop.id] = marker;
  });

  setStatus('Map ready — tap a stop');
  startWatchingPosition();

  document.getElementById('clear-route').addEventListener('click', clearRoute);
}

function selectStop(stop) {
  selectedStopId = stop.id;
  drawRouteToSelected();
}

function drawRouteToSelected() {
  if (!selectedStopId) return;
  const stop = stops.find(s => s.id === selectedStopId);
  if (!stop) return;

  if (!liveLatLng) {
    // Never fail silently — the earlier version left the person tapping
    // with no feedback at all if location wasn't ready yet.
    setStatus(`Selected ${stop.name} — waiting for your location…`);
    return;
  }

  if (routeLine) routeLine.setMap(null);

  routeLine = new google.maps.Polyline({
    path: [liveLatLng, { lat: stop.lat, lng: stop.lng }],
    map,
    strokeColor: '#3a7bd5',
    strokeOpacity: 0.9,
    strokeWeight: 4,
    icons: [{
      icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 },
      offset: '0',
      repeat: '14px'
    }]
  });

  document.getElementById('clear-route').style.display = 'block';
  setStatus(`Routing to ${stop.name} (straight line — real walking route comes later)`);
}

function clearRoute() {
  if (routeLine) { routeLine.setMap(null); routeLine = null; }
  selectedStopId = null;
  document.getElementById('clear-route').style.display = 'none';
  setStatus('Route cleared — tap a stop');
}

function startWatchingPosition() {
  if (!('geolocation' in navigator)) {
    setStatus('Geolocation not available in this browser');
    return;
  }
  navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      liveLatLng = { lat: latitude, lng: longitude };
      if (!liveMarker) {
        liveMarker = new google.maps.Marker({
          position: liveLatLng,
          map,
          title: 'You are here',
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: '#3a7bd5',
            fillOpacity: 1,
            strokeColor: '#ffffff',
            strokeWeight: 2
          },
          zIndex: 999
        });
      } else {
        liveMarker.setPosition(liveLatLng);
      }
      // Keep the route line updated as the person walks, if a stop is selected
      if (selectedStopId) drawRouteToSelected();
    },
    () => {
      setStatus('Location permission not granted — tap a stop to preview, route needs location');
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
  );
}

window.__onGoogleMapsReady = initMap;
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyASmpOeRPerSlZ7WcyEo_ecdFEAd4pIP3E&loading=async&callback=__onGoogleMapsReady" async></script>

</body>
</html>
