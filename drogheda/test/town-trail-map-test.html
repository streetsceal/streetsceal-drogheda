<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>StreetScéal — Town Trail Map Test (hidden)</title>
<style>
  :root {
    --parchment: #f4ecdc;
    --teal: #2f6f6a;
    --rust: #c86a4e;
    --ink: #1f2320;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--parchment);
  }
  #banner {
    background: var(--ink);
    color: var(--parchment);
    padding: 8px 14px;
    font-size: 13px;
    letter-spacing: 0.02em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #banner strong { color: #e8c9a0; }
  #status {
    font-size: 12px;
    opacity: 0.85;
  }
  #map {
    width: 100%;
    height: calc(100% - 38px);
  }
  .legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: rgba(244, 236, 220, 0.95);
    border: 1px solid var(--teal);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--ink);
    max-width: 220px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .legend div { margin: 2px 0; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>

<div id="banner">
  <span><strong>HIDDEN TEST</strong> — Town Trail straight-line route (not linked from live site)</span>
  <span id="status">Locating map…</span>
</div>

<div id="map"></div>

<div class="legend">
  <div><span class="dot" style="background:#c8a96e"></span>Trail stops (numbered, in order)</div>
  <div><span class="dot" style="background:#3a7bd5"></span>Your live position</div>
  <div style="margin-top:6px; opacity:0.75;">Straight-line connector — not a real walking route.</div>
</div>

<script>
// ── Town Trail stop data (copied from trails.json, same order as the
// live trail) ──────────────────────────────────────────────────────
const stops = [
  { id: "white-horse", name: "The White Horse Hotel", lat: 53.714978, lng: -6.353384 },
  { id: "connollys-shop", name: "Connolly's Shop", lat: 53.71376, lng: -6.349491 },
  { id: "millmount", name: "Millmount", lat: 53.711665, lng: -6.349454 },
  { id: "laurence-gate", name: "St Laurence's Gate", lat: 53.71596, lng: -6.347152 },
  { id: "st-peters-church-of-ireland", name: "St Peter's Church of Ireland", lat: 53.716747, lng: -6.350144 },
  { id: "siena-convent", name: "Siena Convent", lat: 53.71715, lng: -6.346015 },
  { id: "st-peters", name: "St Peter's Church", lat: 53.715034, lng: -6.352422 },
  { id: "quayside", name: "The Quayside", lat: 53.71381, lng: -6.348835 }
];

let map;
let liveMarker = null;
let watchId = null;

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function initMap() {
  const bounds = new google.maps.LatLngBounds();
  stops.forEach(s => bounds.extend({ lat: s.lat, lng: s.lng }));

  map = new google.maps.Map(document.getElementById('map'), {
    zoom: 16,
    center: bounds.getCenter(),
    disableDefaultUI: false,
    styles: [] // add a custom map style here later if you want parchment/teal theming on the map tiles themselves
  });
  map.fitBounds(bounds, 60);

  // Numbered markers
  stops.forEach((stop, i) => {
    const marker = new google.maps.Marker({
      position: { lat: stop.lat, lng: stop.lng },
      map,
      label: {
        text: String(i + 1),
        color: '#f4ecdc',
        fontWeight: 'bold'
      },
      title: stop.name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 14,
        fillColor: '#c8a96e',
        fillOpacity: 1,
        strokeColor: '#1f2320',
        strokeWeight: 1.5
      }
    });

    const info = new google.maps.InfoWindow({
      content: `<strong>${i + 1}. ${stop.name}</strong>`
    });
    marker.addListener('click', () => info.open(map, marker));
  });

  // Straight-line connector, stop to stop, in trail order
  new google.maps.Polyline({
    path: stops.map(s => ({ lat: s.lat, lng: s.lng })),
    map,
    strokeColor: '#c8a96e',
    strokeOpacity: 0.9,
    strokeWeight: 4
  });

  setStatus('Map ready');
  startWatchingPosition();
}

function startWatchingPosition() {
  if (!('geolocation' in navigator)) {
    setStatus('Geolocation not available in this browser');
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      setStatus('Live position found');
      if (!liveMarker) {
        liveMarker = new google.maps.Marker({
          position: { lat: latitude, lng: longitude },
          map,
          title: 'You are here',
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: '#3a7bd5',
            fillOpacity: 1,
            strokeColor: '#ffffff',
            strokeWeight: 2
          },
          zIndex: 999
        });
      } else {
        liveMarker.setPosition({ lat: latitude, lng: longitude });
      }
    },
    (err) => {
      setStatus('Location permission not granted — showing route only');
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
  );
}

window.__onGoogleMapsReady = initMap;
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyASmpOeRPerSlZ7WcyEo_ecdFEAd4pIP3E&loading=async&callback=__onGoogleMapsReady" async></script>

</body>
</html>
