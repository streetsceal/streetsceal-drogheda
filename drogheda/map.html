<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreetScéal — Trail Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f3ecd9;
      color: #2b2620;
      height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 1.5rem 2rem 1rem;
      border-bottom: 1px solid #e8dcbd;
      background: #f3ecd9;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #163936;
    }

    header h1 em {
      font-style: normal;
      color: #b5583a;
    }

    header p {
      font-size: 0.95rem;
      color: #7d7462;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: #e8dcbd;
      border-right: 1px solid #e8dcbd;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .trail-list {
      padding: 1rem 0;
    }

    .trail-group {
      margin-bottom: 0.25rem;
    }

    .trail-btn {
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-align: left;
      transition: background 0.15s;
      color: #4a4238;
    }

    .trail-btn:hover {
      background: #e8dcbd;
    }

    .trail-btn.active {
      background: #e8dcbd;
      color: #2b2620;
    }

    .trail-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .trail-label {
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .stops-list {
      padding: 0 0 0.5rem 0;
      display: none;
    }

    .stops-list.open {
      display: block;
    }

    .stop-item {
      padding: 0.45rem 1.2rem 0.45rem 2.8rem;
      font-size: 1rem;
      color: #7d7462;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: all 0.15s;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .stop-item:hover {
      color: #b5583a;
      border-left-color: #b5583a;
    }

    .stop-item.remote {
      font-style: italic;
      color: #9c8f74;
    }

    .stop-item.remote::before {
      content: '↗ ';
      font-style: normal;
    }

    .sidebar-footer {
      padding: 1rem 1.2rem;
      border-top: 1px solid #e8dcbd;
      margin-top: auto;
    }

    .sidebar-footer a {
      color: #b5583a;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .sidebar-footer a:hover {
      text-decoration: underline;
    }

    .sidebar-copyright {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: #7d7462;
      letter-spacing: 0.03em;
    }

    /* Map area */
    .map-container {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 2rem;
      right: 1rem;
      background: rgba(245, 240, 232, 0.95);
      border: 1px solid #e8dcbd;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: 0.06em;
      z-index: 10;
    }

    .legend-title {
      color: #7d7462;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
      font-size: 0.88rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.35rem;
      color: #4a4238;
      padding: 0.15rem 0.3rem;
      margin-left: -0.3rem;
      border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }

    .legend-item:hover {
      background: rgba(139,94,42,0.08);
      color: #2b2620;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }


    @media (max-width: 640px) {
      /* Map takes the full width; the trail picker becomes a small
         floating box in the top-left corner instead of a full-height
         panel, so it no longer covers map labels like the town name. */
      .layout { position: relative; }
      .sidebar {
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        width: auto;
        max-width: 150px;
        max-height: 60vh;
        border-right: none;
        border: 1px solid #e8dcbd;
        border-radius: 6px;
        overflow-y: auto;
        overflow-x: hidden;
        box-shadow: 0 4px 14px rgba(43,38,32,0.18);
        z-index: 5;
      }
      .trail-list {
        display: flex;
        flex-direction: column;
        padding: 0.4rem 0;
        gap: 0;
      }
      .trail-group {
        margin-bottom: 0;
      }
      /* Same vertical pill shape as desktop, just tighter */
      .trail-btn {
        width: 100%;
        padding: 0.55rem 0.65rem;
        gap: 0.5rem;
      }
      .trail-label {
        font-size: 0.78rem;
        letter-spacing: 0.03em;
      }
      .trail-dot {
        width: 8px;
        height: 8px;
      }
      .trail-btn.active {
        background: #b5583a;
        color: #f3ecd9;
      }
      /* Hide stop sub-lists entirely on mobile — map tap handles that */
      .stops-list { display: none !important; }
      .sidebar-footer { display: none; }
      .map-container { flex: 1; min-height: 0; }
      header { padding: 0.75rem 1rem; }
      header h1 { font-size: 1.35rem; }
      .legend { display: none; }
    }
  </style>
</head>
<body>

<header>
  <a href="https://streetsceal.ie" style="text-decoration:none; color:inherit;">
    <h1>Street<em>Scéal</em></h1>
  </a>
  <p>53°43′N · 6°21′W · Drogheda · Trail Map</p>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="trail-list" id="trailList"></nav>
    <div class="sidebar-footer">
      <a href="https://streetsceal.ie" target="_blank">← Return to StreetScéal</a>
      <p class="sidebar-copyright">© 2026 StreetScéal. All rights reserved.</p>
    </div>
  </aside>

  <div class="map-container">
    <div id="map"></div>

    <div class="legend" id="mapLegend">
      <div class="legend-title">Jump to trail start</div>
    </div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let TRAILS = [];
  let map;
  const allMarkers = [];
  const allPolylines = [];

  // ── Load trails.json, then boot the map ───────────────────────────────────
  fetch('trails.json')
    .then(r => r.json())
    .then(data => {
      // Trails can be flagged "hidden": true in trails.json to keep their
      // content fully intact but pull them out of public view (sidebar +
      // map markers) — e.g. while focusing a funding pitch on fewer trails.
      // Flip the flag back off in trails.json to bring one back.
      TRAILS = data.trails.filter(t => !t.hidden);
      buildSidebar();
      loadGoogleMaps();
    })
    .catch(err => {
      console.error('Could not load trails.json:', err);
      document.getElementById('trailList').innerHTML =
        '<p style="padding:1rem;color:#b5583a;font-size:1rem;">Could not load trail data.</p>';
    });

  // ── Sidebar ────────────────────────────────────────────────────────────────
  function buildSidebar() {
    const trailList = document.getElementById('trailList');
    const legend = document.getElementById('mapLegend');
    trailList.innerHTML = '';

    TRAILS.forEach(trail => {
      const group = document.createElement('div');
      group.className = 'trail-group';

      const btn = document.createElement('button');
      btn.className = 'trail-btn';
      btn.dataset.id = trail.id;
      btn.innerHTML = `
        <span class="trail-dot" style="background:${trail.color}"></span>
        <span class="trail-label">${trail.label}</span>
      `;

      const stopsList = document.createElement('div');
      stopsList.className = 'stops-list';
      stopsList.id = `stops-${trail.id}`;

      trail.stops.forEach(stop => {
        const item = document.createElement('div');
        item.className = 'stop-item' + (stop.remote ? ' remote' : '') + (stop.linking ? ' linking' : '');
        // Show audio/AR badges
        const badges = [];
        if (stop.hasAudio) badges.push('♪');
        if (stop.hasAR) badges.push('AR');
        const badgeHtml = badges.length ? `<span style="float:right;font-size:0.85rem;color:${trail.color};opacity:0.7">${badges.join(' ')}</span>` : '';
        item.innerHTML = stop.name + badgeHtml;
        // Direct selection of a specific stop is a clear "I want this trail" signal —
        // skip the preview panel and go straight there, same tab.
        item.addEventListener('click', () => { window.location.href = trail.url; });
        stopsList.appendChild(item);
      });

      btn.addEventListener('click', () => {
        // On mobile the stop sub-list is hidden entirely (map tap handles
        // that), so expanding it here would do nothing visible — go
        // straight to the trail instead, consistent with how pins and
        // individual stops already behave everywhere.
        if (window.matchMedia('(max-width: 640px)').matches) {
          window.location.href = trail.url;
        } else {
          toggleTrail(trail.id, btn, stopsList);
        }
      });
      group.appendChild(btn);
      group.appendChild(stopsList);
      trailList.appendChild(group);

      // Legend entry — jumps map to this trail's starting stop
      const li = document.createElement('div');
      li.className = 'legend-item';
      li.style.cursor = 'pointer';
      li.innerHTML = `<span class="legend-dot" style="background:${trail.color}"></span><span>${trail.label}</span>`;
      li.addEventListener('click', () => jumpToTrailStart(trail));
      legend.appendChild(li);
    });
  }

  function toggleTrail(id, btn, list) {
    const isOpen = list.classList.contains('open');
    document.querySelectorAll('.stops-list').forEach(l => l.classList.remove('open'));
    document.querySelectorAll('.trail-btn').forEach(b => b.classList.remove('active'));
    if (!isOpen) {
      list.classList.add('open');
      btn.classList.add('active');
      const trail = TRAILS.find(t => t.id === id);
      const local = trail.stops.filter(s => !s.remote);
      if (local.length && map) {
        const avgLat = local.reduce((a, s) => a + s.lat, 0) / local.length;
        const avgLng = local.reduce((a, s) => a + s.lng, 0) / local.length;
        map.panTo({ lat: avgLat, lng: avgLng });
        map.setZoom(id === 'plunkett' || id === 'diaspora' ? 5 : 15);
      }
    }
  }

  // Legend shortcut — now consistent with pins/sidebar stops: a deliberate
  // choice of trail should go straight there, no preview panel detour.
  function jumpToTrailStart(trail) {
    if (!trail.stops.length) return;
    window.location.href = trail.url;
  }

  // ── Map init (called by Google Maps callback) ──────────────────────────────
  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 53.714192, lng: -6.350085 },
      zoom: 15,
      styles: [
        { elementType: 'geometry', stylers: [{ color: '#efe7d3' }] },
        { elementType: 'labels.text.stroke', stylers: [{ color: '#efe7d3' }] },
        { elementType: 'labels.text.fill', stylers: [{ color: '#4a4238' }] },
        { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#b5583a' }] },
        { featureType: 'poi', elementType: 'labels.text.fill', stylers: [{ color: '#6b6255' }] },
        { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#d6e2c7' }] },
        { featureType: 'poi.park', elementType: 'labels.text.fill', stylers: [{ color: '#4d6b42' }] },
        { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#f6efd9' }] },
        { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#e8dcbd' }] },
        { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#8a7457' }] },
        { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#d9bf95' }] },
        { featureType: 'road.highway', elementType: 'geometry.stroke', stylers: [{ color: '#c7a672' }] },
        { featureType: 'road.highway', elementType: 'labels.text.fill', stylers: [{ color: '#4a3520' }] },
        { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#e0d6b8' }] },
        { featureType: 'transit.station', elementType: 'labels.text.fill', stylers: [{ color: '#6b6255' }] },
        { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#9dc2bd' }] },
        { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#2f5f5a' }] },
        { featureType: 'water', elementType: 'labels.text.stroke', stylers: [{ color: '#9dc2bd' }] },
      ],
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: true,
      zoomControl: true,
    });

    // Wait for TRAILS to be populated (fetch may still be in flight)
    if (TRAILS.length) renderMapData();
    else window._mapReady = true;
  }

  function renderMapData() {
    TRAILS.forEach(trail => {
      const coords = trail.stops.map(s => ({ lat: s.lat, lng: s.lng }));

      new google.maps.Polyline({
        path: coords,
        geodesic: true,
        strokeColor: trail.color,
        strokeOpacity: 0.45,
        strokeWeight: 2,
        map,
      });

      trail.stops.forEach(stop => {
        const marker = new google.maps.Marker({
          position: { lat: stop.lat, lng: stop.lng },
          map,
          title: stop.name,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: stop.remote ? 5 : 7,
            fillColor: trail.color,
            fillOpacity: stop.remote ? 0.5 : 1,
            strokeColor: '#f3ecd9',
            strokeWeight: 2,
          },
          zIndex: stop.remote ? 1 : 2,
        });
        // Same reasoning as the sidebar stop click above — a marker tap is a
        // specific, deliberate choice, so skip straight to the trail.
        marker.addListener('click', () => { window.location.href = trail.url; });
        allMarkers.push(marker);
      });
    });
  }

  // ── Load Google Maps ───────────────────────────────────────────────────────
  function loadGoogleMaps() {
    // If map already initialised (unlikely but safe), just render data
    if (map) { renderMapData(); return; }
    const script = document.createElement('script');
    script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyASmpOeRPerSlZ7WcyEo_ecdFEAd4pIP3E&callback=initMap';
    script.async = true;
    script.defer = true;
    document.head.appendChild(script);
  }
</script>
</body>
</html>
